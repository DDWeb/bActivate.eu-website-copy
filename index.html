  <!-- Structured Data - FAQPage -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What is bActivate?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "bActivate is a bacterial growth medium used by veterinarians to reactivate dormant Streptococcus equi subsp. zooepidemicus infections in the uterus of problem mares. It enables accurate diagnosis and treatment of subclinical endometritis that standard tests fail to detect."
        }
      },
      {
        "@type": "Question",
        "name": "Why can't my mare get in foal?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "70–80% of problem mares carry a hidden uterine infection caused by dormant bacteria. These bacteria enter a low-metabolic 'persister' state that evades standard uterine cultures and resists antibiotics. bActivate reactivates them so they can be diagnosed and treated."
        }
      },
      {
        "@type": "Question",
        "name": "How does bActivate work?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "A veterinarian instills 10 ml of bActivate into the mare's uterus during early estrus. The growth medium reactivates dormant bacteria within 48 hours, making them detectable by standard culture. The veterinarian then prescribes targeted antibiotic treatment based on the result."
        }
      },
      {
        "@type": "Question",
        "name": "What pregnancy rates has bActivate achieved in clinical studies?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "In a study at Hagyard Equine Medical Institute led by Dr. Kristina Lu, 83% of 64 problem mares became pregnant after bActivate treatment. At Kildangan Stud (Godolphin), 89% pregnancy rate was achieved in 19 problem mares. Copenhagen University data showed a 72% live foal rate."
        }
      },
      {
        "@type": "Question",
        "name": "When should bActivate be used?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "bActivate is indicated for mares that have failed to conceive despite breeding to fertile stallions, mares with recurring uterine fluid, mares with previous uterine infections, and older broodmares with reduced uterine defense. It is administered during estrus, 5 days before intended breeding."
        }
      },
      {
        "@type": "Question",
        "name": "Is bActivate safe for mares?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. bActivate has been tested extensively at leading equine hospitals including Hagyard Equine Medical Institute. The infusion may cause a mild, temporary uterine reaction in heavily infected mares. Breeding in the same cycle as activation is not recommended."
        }
      },
      {
        "@type": "Question",
        "name": "Where can I buy bActivate?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "bActivate is available through authorised equine veterinary distributors in the US, Europe, and Australia. In the US, it is available through Hagyard Pharmacy and Midwest Veterinary Supply. See our distributors page for full details."
        }
      }
    ]
  }
  </script>
