        <h1>bActivate — Treat Hidden Uterine Infections in Problem Mares</h1>
        <p>70–80% of problem mares carry a hidden uterine infection caused by dormant Streptococcus equi subsp. zooepidemicus. bActivate is a bacterial growth medium instilled by a veterinarian to reactivate dormant infections, enabling accurate diagnosis and targeted treatment. 83% pregnancy rate in 64 problem mares at Hagyard Equine Medical Institute (Dr. Kristina Lu). 89% pregnancy rate at Kildangan Stud – Godolphin (19 mares). 72% live foal rate, Copenhagen University / Breeders Club.</p>

        <h2>What is bActivate?</h2>
        <p>bActivate is a diagnostic aid for detecting dormant Streptococcus equi subsp. zooepidemicus infections in the uterus of problem mares. These bacteria enter a low-metabolic persister state that evades standard uterine cultures and resists antibiotics. bActivate reactivates them within 48 hours, making them detectable by standard culture. One vial €229. Available from bactivate.eu and authorised European distributors.</p>

        <h2>When to Use bActivate</h2>
        <p>bActivate is indicated when a mare fails to conceive despite breeding to fertile stallions, has a history of recurring uterine fluid, has had previous uterine infections, or is an older broodmare with reduced uterine defense. Studies indicate 50–75% of mares that remain open at the end of the breeding season are chronically infected. Some farms use bActivate as an off-season screening tool for all open mares.</p>

        <h2>How to Use bActivate — Veterinary Protocol</h2>
        <p>1. Obtain a pre-activation uterine culture sample. 2. Instill 10 ml of bActivate into the uterus in early estrus (largest follicle 25–30 mm). 3. Obtain a post-activation culture 48 hours later. 4. Begin targeted antibiotic therapy based on culture results. Breeding in the same estrus cycle is not recommended. Requires a veterinarian with documented education and authorisation to practice.</p>

        <h2>Clinical Studies — 83% Pregnancy Rate at Hagyard</h2>
        <p>Hagyard Equine Medical Institute (Dr. Kristina Lu, Davidson, McGee): 64 problem mares treated, 53 (83%) became pregnant. Kildangan Stud – Godolphin: 19 problem mares, 89% pregnancy rate. Copenhagen University / Breeders Club: 72% live foal rate. Peer-reviewed research: Petersen &amp; Bojesen, Veterinary Microbiology, 2015. DOI: 10.1016/j.vetmic.2015.07.020</p>

        <h2>About the Founders — E-E-A-T Credentials</h2>
        <p><strong>Dr. Morten Rønn Petersen DVM, PhD, Dipl. ACT</strong> — Equine reproduction specialist, 21+ peer-reviewed publications including Nature Medicine (2025). Head of Laboratory, Fertility Clinic Rigshospitalet, Copenhagen. Co-founder, Bojesen &amp; Petersen Biotech ApS. LinkedIn: linkedin.com/in/mortenrpetersen</p>
        <p><strong>Prof. Anders Miki Bojesen DVM, PhD, Diplomate ECPVS</strong> — Professor of Veterinary Microbiology, University of Copenhagen. 157+ peer-reviewed publications. Invited speaker, International Workshop on Equine Endometritis, Al Shaqab Qatar 2016. Co-founder, Bojesen &amp; Petersen Biotech ApS. LinkedIn: linkedin.com/in/anders-miki-bojesen</p>

        <h2>Distributors — Europe, US, Australia</h2>
        <p>Europe direct: Bojesen &amp; Petersen Biotech ApS, Strandboulevarden 23, DK-2100 Copenhagen. contact@bactivate.eu. UK: Nupsala LTD, Melton Mowbray (+44 1865 922 227). Netherlands: Grovet, Soesterberg (+44 142 248 1900). Denmark: proVET Nordic ApS (+45 53 28 29 29). USA: Hagyard Pharmacy, Lexington KY (859-281-9511). Midwest Veterinary Supply, Lakeville MN (1-800-643-9378). Australia: Scone Equine Hospital (+61 2 6545 1333).</p>
