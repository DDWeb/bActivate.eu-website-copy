          "@type": "Answer",
          "text": "bActivate is a bacterial growth medium used by veterinarians to reactivate dormant Streptococcus equi subsp. zooepidemicus infections in the uterus of problem mares. It enables accurate diagnosis and treatment of subclinical endometritis that standard tests fail to detect."

      },
      {
        "@type": "Question",
        "name": "Why can't my mare get in foal despite clean swabs?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "70–80% of problem mares carry a hidden uterine infection caused by dormant bacteria. These bacteria enter a low-metabolic 'persister' state that evades standard uterine cultures and resists antibiotics. Standard swabs miss this infection in over 60% of cases. bActivate reactivates the bacteria so they can be accurately diagnosed and treated."
        }
      },
      {
        "@type": "Question",
        "name": "What is subclinical endometritis and why is it hard to detect?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Subclinical endometritis is a silent uterine inflammation with no visible symptoms — no discharge, no fever, no abnormal cycles. Despite appearing normal, the inflammation prevents embryo implantation. Because bacteria are in a dormant, low-metabolic state, they are not picked up by routine swabs or culture tests."
        }
      },
      {
        "@type": "Question",
        "name": "What is a biofilm infection in a mare's uterus?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Biofilm is a protective layer that bacteria like Streptococcus zooepidemicus build around themselves inside the uterus. This shield makes them resistant to antibiotics and undetectable by standard swabs. Biofilm infections are a major cause of chronic, treatment-resistant infertility in problem mares."
        }
      },
      {
        "@type": "Question",
        "name": "Why do antibiotics sometimes fail to cure uterine infections in mares?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "When bacteria form biofilms or enter a dormant persister state, they become resistant to antibiotics — even ones they are technically sensitive to. Antibiotics cannot penetrate the biofilm shield effectively. bActivate reactivates the bacteria first, making them metabolically active and vulnerable to targeted antibiotic treatment."
        }
      },
      {
        "@type": "Question",
        "name": "What are the signs of a hidden uterine infection in a mare?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Key signs include: repeated failure to conceive despite breeding to a fertile stallion, recurring uterine fluid detected on ultrasound, clean swab results combined with unexplained infertility, early embryo loss, and a history of multiple failed antibiotic treatments. If your mare shows these signs, dormant bacterial infection may be the cause."
        }
      },
      {
        "@type": "Question",
        "name": "How does bActivate work?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "A veterinarian instills 10 ml of bActivate into the mare's uterus during early estrus. The growth medium reactivates dormant bacteria within 48 hours, making them detectable by standard culture. The veterinarian then prescribes targeted antibiotic treatment based on the culture result. Breeding is recommended in the following cycle."
        }
      },

      },

          "text": "bActivate is indicated for mares that have failed to conceive despite breeding to fertile stallions, mares with recurring uterine fluid, mares with previous uterine infections, older broodmares with reduced uterine defense, and mares where antibiotics have previously failed. It is administered during estrus, approximately 5 days before intended breeding in the next cycle."
        }
      },
      {
        "@type": "Question",

          "@type": "Answer",
          "text": "Yes. Older mares (10+ years) and mares with multiple previous foals are among the most common candidates for bActivate, as uterine defence mechanisms weaken with age. Clinical studies include a significant proportion of older problem mares with long histories of infertility."

        <h1>bActivate — Treat Hidden Uterine Infections in Problem Mares</h1>
        <p>70–80% of problem mares carry a hidden uterine infection caused by dormant Streptococcus equi subsp. zooepidemicus. bActivate is a bacterial growth medium instilled by a veterinarian to reactivate dormant infections, enabling accurate diagnosis and targeted treatment. 83% pregnancy rate in 64 problem mares at Hagyard Equine Medical Institute (Dr. Kristina Lu). 89% pregnancy rate at Kildangan Stud – Godolphin (19 mares). 72% live foal rate, Copenhagen University / Breeders Club.</p>

        <h2>What is bActivate?</h2>
        <p>bActivate is a diagnostic aid for detecting dormant Streptococcus equi subsp. zooepidemicus infections in the uterus of problem mares. These bacteria enter a low-metabolic persister state that evades standard uterine cultures and resists antibiotics. bActivate reactivates them within 48 hours, making them detectable by standard culture. One vial €229. Available from bactivate.eu and authorised European distributors.</p>

        <h2>When to Use bActivate</h2>
        <p>bActivate is indicated when a mare fails to conceive despite breeding to fertile stallions, has a history of recurring uterine fluid, has had previous uterine infections, or is an older broodmare with reduced uterine defense. Studies indicate 50–75% of mares that remain open at the end of the breeding season are chronically infected. Some farms use bActivate as an off-season screening tool for all open mares.</p>

        <h2>How to Use bActivate — Veterinary Protocol</h2>
        <p>1. Obtain a pre-activation uterine culture sample. 2. Instill 10 ml of bActivate into the uterus in early estrus (largest follicle 25–30 mm). 3. Obtain a post-activation culture 48 hours later. 4. Begin targeted antibiotic therapy based on culture results. Breeding in the same estrus cycle is not recommended. Requires a veterinarian with documented education and authorisation to practice.</p>

        <h2>Clinical Studies — 83% Pregnancy Rate at Hagyard</h2>
        <p>Hagyard Equine Medical Institute (Dr. Kristina Lu, Davidson, McGee): 64 problem mares treated, 53 (83%) became pregnant. Kildangan Stud – Godolphin: 19 problem mares, 89% pregnancy rate. Copenhagen University / Breeders Club: 72% live foal rate. Peer-reviewed research: Petersen &amp; Bojesen, Veterinary Microbiology, 2015. DOI: 10.1016/j.vetmic.2015.07.020</p>

        <h2>About the Founders — E-E-A-T Credentials</h2>
        <p><strong>Dr. Morten Rønn Petersen DVM, PhD, Dipl. ACT</strong> — Equine reproduction specialist, 21+ peer-reviewed publications including Nature Medicine (2025). Head of Laboratory, Fertility Clinic Rigshospitalet, Copenhagen. Co-founder, Bojesen &amp; Petersen Biotech ApS. LinkedIn: linkedin.com/in/mortenrpetersen</p>
        <p><strong>Prof. Anders Miki Bojesen DVM, PhD, Diplomate ECPVS</strong> — Professor of Veterinary Microbiology, University of Copenhagen. 157+ peer-reviewed publications. Invited speaker, International Workshop on Equine Endometritis, Al Shaqab Qatar 2016. Co-founder, Bojesen &amp; Petersen Biotech ApS. LinkedIn: linkedin.com/in/anders-miki-bojesen</p>

        <h2>Distributors — Europe, US, Australia</h2>
        <p>Europe direct: Bojesen &amp; Petersen Biotech ApS, Strandboulevarden 23, DK-2100 Copenhagen. contact@bactivate.eu. UK: Nupsala LTD, Melton Mowbray (+44 1865 922 227). Netherlands: Grovet, Soesterberg (+44 142 248 1900). Denmark: proVET Nordic ApS (+45 53 28 29 29). USA: Hagyard Pharmacy, Lexington KY (859-281-9511). Midwest Veterinary Supply, Lakeville MN (1-800-643-9378). Australia: Scone Equine Hospital (+61 2 6545 1333).</p>
